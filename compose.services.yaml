      DATABASE_URL: postgresql://${POSTGRES_USER:-compralatino}:${POSTGRES_PASSWORD:-compralatino}@postgres:5432/${POSTGRES_DB:-compralatino}?schema=yauctions_svc
      RABBITMQ_QUEUE: yauctions_svc_queue
    ports:
      - '3006:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.yauctions-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/yauctions/`)
      - traefik.http.routers.yauctions-api.entrypoints=web
      - traefik.http.routers.yauctions-api.middlewares=yauctions-api-strip
      - traefik.http.middlewares.yauctions-api-strip.stripprefix.prefixes=/yauctions
      - traefik.http.services.yauctions-api.loadbalancer.server.port=3000

  frontend:
    restart: unless-stopped
    profiles: ['frontend', 'services', 'all']
    build:
      context: ../compralatino-frontend
      dockerfile: Dockerfile
    container_name: compralatino_frontend
    env_file:
      - ../compralatino-frontend/.env
    environment:
      # Server-side proxy target: Traefik on the Docker network (see gateway routers).
      NEXT_PUBLIC_API_URL: http://traefik
    ports:
      - '3000:3000'
    networks:
      - compralatino_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`localhost`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=3000

networks:
  compralatino_net:
    driver: bridge
    name: compralatino_net
