x-backend-common: &backend-common
  restart: unless-stopped
  networks:
    - compralatino_net
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_started
      required: false
    rabbitmq:
      condition: service_healthy
      required: false

x-backend-env-common: &backend-env-common
  PORT: 3000
  CACHE_ENABLED: 'true'
  CACHE_STORE: redis
  QUEUE_ENABLED: 'true'
  RABBITMQ_ENABLED: 'true'
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-compralatino_events}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-compralatino}:${RABBITMQ_PASSWORD:-compralatino}@rabbitmq:5672
  THROTTLE_STORAGE: redis
  THROTTLE_TRUST_PROXY: 'true'

services:
  users-api:
    <<: *backend-common
    profiles: ['users-api', 'services', 'all']
    image: cabreraevil/compralatino-users-api
    container_name: compralatino_users_api
    env_file:
      - ../compralatino-users-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: users_svc_queue
    ports:
      - '3001:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.users-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/users/`)
      - traefik.http.routers.users-api.entrypoints=web
      - traefik.http.routers.users-api.middlewares=users-api-strip
      - traefik.http.middlewares.users-api-strip.stripprefix.prefixes=/users
      - traefik.http.services.users-api.loadbalancer.server.port=3000
      - traefik.http.routers.users-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && (PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/user`) || PathPrefix(`/api/v1/role`) || PathPrefix(`/api/v1/permissions`) || PathPrefix(`/api/v1/api-key`) || PathPrefix(`/api/v1/audit-log`))
      - traefik.http.routers.users-api-v1.entrypoints=web
      - traefik.http.routers.users-api-v1.service=users-api

  catalog-api:
    <<: *backend-common
    profiles: ['catalog-api', 'services', 'all']
    image: cabreraevil/compralatino-catalog-api
    container_name: compralatino_catalog_api
    env_file:
      - ../compralatino-catalog-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: catalog_svc_queue
      YAUCTIONS_RPC_TIMEOUT_MS: ${YAUCTIONS_RPC_TIMEOUT_MS:-3000}
    ports:
      - '3002:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.catalog-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/catalog/`)
      - traefik.http.routers.catalog-api.entrypoints=web
      - traefik.http.routers.catalog-api.middlewares=catalog-api-strip
      - traefik.http.middlewares.catalog-api-strip.stripprefix.prefixes=/catalog
      - traefik.http.services.catalog-api.loadbalancer.server.port=3000
      - traefik.http.routers.catalog-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && (PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/categories`))
      - traefik.http.routers.catalog-api-v1.entrypoints=web
      - traefik.http.routers.catalog-api-v1.service=catalog-api

  orders-api:
    <<: *backend-common
    profiles: ['orders-api', 'services', 'all']
    image: cabreraevil/compralatino-orders-api
    container_name: compralatino_orders_api
    env_file:
      - ../compralatino-orders-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: orders_svc_queue
      CATALOG_RPC_TIMEOUT_MS: ${CATALOG_RPC_TIMEOUT_MS:-5000}
    ports:
      - '3003:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.orders-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/orders/`)
      - traefik.http.routers.orders-api.entrypoints=web
      - traefik.http.routers.orders-api.middlewares=orders-api-strip
      - traefik.http.middlewares.orders-api-strip.stripprefix.prefixes=/orders
      - traefik.http.services.orders-api.loadbalancer.server.port=3000
      - traefik.http.routers.orders-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && (PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/cart`) || PathPrefix(`/api/v1/checkout-options`))
      - traefik.http.routers.orders-api-v1.entrypoints=web
      - traefik.http.routers.orders-api-v1.service=orders-api

  recommendations-api:
    <<: *backend-common
    profiles: ['recommendations-api', 'services', 'all']
    image: cabreraevil/compralatino-recommendations-api
    container_name: compralatino_recommendations_api
    env_file:
      - ../compralatino-recommendations-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: recommendations_svc_queue
      CATALOG_RPC_TIMEOUT_MS: ${CATALOG_RPC_TIMEOUT_MS:-5000}
    ports:
      - '3004:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.recommendations-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/recommendations/`)
      - traefik.http.routers.recommendations-api.entrypoints=web
      - traefik.http.routers.recommendations-api.middlewares=recommendations-api-strip
      - traefik.http.middlewares.recommendations-api-strip.stripprefix.prefixes=/recommendations
      - traefik.http.services.recommendations-api.loadbalancer.server.port=3000
      - traefik.http.routers.recommendations-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/api/v1/recommendations`)
      - traefik.http.routers.recommendations-api-v1.entrypoints=web
      - traefik.http.routers.recommendations-api-v1.service=recommendations-api

  admin-api:
    <<: *backend-common
    profiles: ['admin-api', 'services', 'all']
    image: cabreraevil/compralatino-admin-api
    container_name: compralatino_admin_api
    env_file:
      - ../compralatino-admin-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: admin_svc_queue
    ports:
      - '3005:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/admin/`)
      - traefik.http.routers.admin-api.entrypoints=web
      - traefik.http.routers.admin-api.middlewares=admin-api-strip
      - traefik.http.middlewares.admin-api-strip.stripprefix.prefixes=/admin
      - traefik.http.services.admin-api.loadbalancer.server.port=3000
      - traefik.http.routers.admin-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/api/v1/admin`)
      - traefik.http.routers.admin-api-v1.entrypoints=web
      - traefik.http.routers.admin-api-v1.service=admin-api

  yauctions-api:
    <<: *backend-common
    profiles: ['yauctions-api', 'services', 'all']
    image: cabreraevil/compralatino-yauctions-api
    container_name: compralatino_yauctions_api
    env_file:
      - ../compralatino-yauctions-api/.env
      - ../.env.shared
    environment:
      <<: *backend-env-common
      RABBITMQ_QUEUE: yauctions_svc_queue
      SCRAPER_ENABLED: ${SCRAPER_ENABLED:-false}
      SCRAPER_INTERVAL_MS: ${SCRAPER_INTERVAL_MS:-21600000}
    ports:
      - '3006:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.yauctions-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/yauctions/`)
      - traefik.http.routers.yauctions-api.entrypoints=web
      - traefik.http.routers.yauctions-api.middlewares=yauctions-api-strip
      - traefik.http.middlewares.yauctions-api-strip.stripprefix.prefixes=/yauctions
      - traefik.http.services.yauctions-api.loadbalancer.server.port=3000
      - traefik.http.routers.yauctions-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/api/v1/yauctions`)
      - traefik.http.routers.yauctions-api-v1.entrypoints=web
      - traefik.http.routers.yauctions-api-v1.service=yauctions-api

  frontend:
    restart: unless-stopped
    profiles: ['frontend', 'services', 'all']
    image: cabreraevil/compralatino-frontend
    container_name: compralatino_frontend
    env_file:
      - ../compralatino-frontend/.env
    environment:
      # Rewrite target for /api/*: Traefik on the Docker network, routed by resource path under /api/v1.
      NEXT_PUBLIC_API_URL: http://traefik/api/v1
      NEXT_PUBLIC_PROXY: 'true'
      NEXT_PUBLIC_HOST: ${FRONTEND_ORIGIN:-http://localhost}
      # Public origin for Auth.js; the server itself binds to 0.0.0.0 inside the container.
      AUTH_URL: ${FRONTEND_ORIGIN:-http://localhost}
      AUTH_TRUST_HOST: 'true'
    ports:
      - '3000:3000'
    networks:
      - compralatino_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`localhost`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=3000

networks:
  compralatino_net:
    driver: bridge
    name: compralatino_net
