services:
  postgres:
    image: postgres:16.2-bookworm
    container_name: compralatino_postgres
    restart: unless-stopped
    profiles: ['postgres', 'infra', 'all']
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-compralatino}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-compralatino}
      - POSTGRES_DB=${POSTGRES_DB:-compralatino}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - compralatino_postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - compralatino_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-compralatino}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-rc2-x86_64
    container_name: compralatino_redis
    restart: unless-stopped
    profiles: ['redis', 'infra', 'all']
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-compralatino}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - compralatino_redis:/data
    networks:
      - compralatino_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: compralatino_rabbitmq
    restart: unless-stopped
    profiles: ['rabbitmq', 'infra', 'all']
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-compralatino}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-compralatino}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - compralatino_rabbitmq:/var/lib/rabbitmq
    networks:
      - compralatino_net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  compralatino_net:
    driver: bridge
    name: compralatino_net

volumes:
  compralatino_postgres:
    name: compralatino_postgres
  compralatino_redis:
    name: compralatino_redis
  compralatino_rabbitmq:
    name: compralatino_rabbitmq
